<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A2E2B">
<title>My Account | Stackly Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--p:#0E9F8E;--p2:#0A7F72;--ink:#0A2E2B;--ink2:#0F4A44;--acc:#FFB547;--bg:#F1FBF8;--line:#D5EBE5;--mut:#5E7B76;--ok:#2fae66;--bad:#e5484d;--fh:'DM Serif Display',serif;--fb:'Nunito Sans',system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--sw:256px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:clip}
body{font-family:var(--fb);background:var(--bg);color:#12332F;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}ul{list-style:none}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:min(var(--sw),86vw);z-index:50;display:flex;flex-direction:column;padding:20px 14px;color:#fff;overflow-y:auto;background:radial-gradient(circle at 10% 0,rgba(14,159,142,.5),transparent 50%),linear-gradient(170deg,var(--ink2),var(--ink))}
.brand{display:flex;justify-content:center;margin-bottom:14px}.brand img{height:56px;width:auto}
.x{display:none;position:absolute;top:35px;right:14px;width:36px;height:36px;place-items:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);transition:.25s}
.x:hover{background:var(--acc);color:var(--ink);transform:rotate(90deg)}
.grp{font-size:.68rem;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.45);margin:14px 10px 6px;font-weight:800}
.nav{display:grid;gap:3px}
.nav>*{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;font-size:.9rem;font-weight:700;color:rgba(255,255,255,.78);text-align:left;transition:.2s}
.nav i{width:18px;text-align:center}
.nav>*:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(3px)}
.nav .on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 8px 18px -8px rgba(14,159,142,.9)}
.nav .n{margin-left:auto;font-size:.68rem;padding:1px 8px;border-radius:99px;background:var(--acc);color:var(--ink);font-weight:800}
.su{display:flex;align-items:center;gap:10px;margin-top:auto;padding:10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.su div{min-width:0}.su b{display:block;font-size:.85rem;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su small{display:block;font-size:.7rem;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--fh);text-transform:uppercase;background:var(--acc);color:var(--ink)}
.lo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;padding:10px;border-radius:10px;font-size:.8rem;font-weight:800;color:#ff9a9d;background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.3)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,25,23,.65);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.25s}.ov.show{opacity:1;visibility:visible}

/* main */
.main{flex:1;min-width:0;margin-left:var(--sw)}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 28px;min-height:64px;background:rgba(241,251,248,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--fh);font-weight:400;font-size:1.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;width:42px;height:42px;border-radius:10px;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 16px -8px rgba(14,159,142,.9)}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.shop{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;font-size:.82rem;font-weight:800;color:#fff;background:var(--p);transition:.2s}.shop:hover{background:var(--p2)}
.content{padding:24px 28px 56px;max-width:1360px;margin:0 auto}
.rise{opacity:0;transform:translateY(14px);animation:rise .55s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{to{opacity:1;transform:none}}
.still .rise{animation:none;opacity:1;transform:none}

/* hero */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:32px;margin-bottom:20px;border-radius:18px;color:#fff;background:radial-gradient(circle at 12% 0,rgba(14,159,142,.65),transparent 55%),radial-gradient(circle at 95% 100%,rgba(255,181,71,.22),transparent 45%),linear-gradient(135deg,var(--ink2),var(--ink))}
.hero>*{position:relative;z-index:1}
.hero::before{content:"\f067";font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;right:-30px;top:-40px;font-size:11rem;color:rgba(255,255,255,.05);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.eb{font-size:.72rem;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:var(--acc);margin-bottom:6px}
.hero h2{font-family:var(--fh);font-weight:400;font-size:2.4rem;line-height:1.1;margin-bottom:8px;text-transform:capitalize}
.hero p{max-width:500px;opacity:.82;line-height:1.6;font-size:.95rem}
.ecg{display:block;width:min(320px,100%);height:44px;margin-top:14px}
.ecg path{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:520;stroke-dashoffset:520;animation:ecg 2.6s linear infinite;filter:drop-shadow(0 0 5px rgba(255,181,71,.7))}
@keyframes ecg{0%{stroke-dashoffset:520}70%,100%{stroke-dashoffset:0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:800;font-size:.88rem;border:1.5px solid var(--p);background:var(--p);color:#fff;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(14,159,142,.85)}
.btn.amb{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.gh{background:transparent;color:var(--p)}.btn.sm{padding:6px 12px;font-size:.8rem}
.btn.red{background:var(--bad);border-color:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{padding:20px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center;transition:.25s}
.stat:hover{transform:translateY(-5px);border-color:var(--p);box-shadow:0 18px 30px -18px rgba(14,159,142,.65)}
.stat i{width:44px;height:44px;display:grid;place-items:center;margin:0 auto 12px;border-radius:12px;color:var(--p);background:rgba(14,159,142,.1);transition:.4s}
.stat:hover i{background:var(--p);color:#fff;transform:rotateY(360deg)}
.stat b{display:block;font-family:var(--fh);font-weight:400;font-size:2.1rem;line-height:1}
.stat small{display:block;margin-top:4px;font-size:.78rem;color:var(--mut);font-weight:700}

/* cards */
.g2{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px;align-items:start}.g2>*{min-width:0}
.card{padding:22px;margin-bottom:16px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:0}.g2 .card{margin-bottom:0}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h3{font-family:var(--fh);font-weight:400;font-size:1.35rem}.ch p{font-size:.8rem;color:var(--mut);margin-top:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;padding:0 10px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--mut);border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid var(--line);font-size:.86rem}tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(14,159,142,.06)}
.t2{font-size:.75rem;color:var(--mut);margin-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:800;white-space:nowrap}
.s-processing,.s-review{background:rgba(255,181,71,.28);color:#8a5a06}.s-shipped,.s-active{background:rgba(14,159,142,.15);color:var(--p2)}.s-delivered{background:rgba(47,174,102,.16);color:#1f8a4f}.s-expiring{background:rgba(229,72,77,.14);color:#c0353a}

/* order tracker */
.trk{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin:6px 0 4px;text-align:center}
.trk::before{content:"";position:absolute;top:17px;left:12.5%;right:12.5%;height:3px;background:#DCEFEA}
.trk::after{content:"";position:absolute;top:17px;left:12.5%;height:3px;width:var(--w,0%);background:linear-gradient(90deg,var(--p),var(--acc));transition:width 1.2s var(--ease) .3s}
.trk div{position:relative;z-index:1;font-size:.74rem;font-weight:700;color:var(--mut)}
.trk i{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid #DCEFEA;font-size:.8rem}
.trk .d{color:var(--ink)}.trk .d i{background:var(--p);border-color:var(--p);color:#fff}
.trk .c i{border-color:var(--acc);color:var(--p);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.6)}100%{box-shadow:0 0 0 12px rgba(255,181,71,0)}}

/* feed / reminders / progress */
.feed li{display:flex;gap:12px;padding:11px 4px;border-radius:10px}.feed li:hover{background:rgba(14,159,142,.06)}
.feed i{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:.85rem;background:rgba(14,159,142,.12);color:var(--p)}
.feed p{font-size:.85rem;line-height:1.45}.feed small{font-size:.74rem;color:var(--mut)}
.rm{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);transition:.25s}
.rm:hover{border-color:var(--p);transform:translateX(3px)}
.rm .ck{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:transparent;transition:.25s}
.rm.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.rm.done b{text-decoration:line-through;opacity:.55}
.rm b{display:block;font-size:.9rem}.rm small{color:var(--mut);font-size:.76rem}
.rm .tm{margin-left:auto;font-weight:800;font-size:.8rem;color:var(--p);white-space:nowrap}
.ring{display:grid;place-items:center;width:130px;height:130px;margin:0 auto 12px;border-radius:50%;background:conic-gradient(var(--p) calc(var(--v)*1%),#DCEFEA 0);transition:.6s}
.ring span{display:grid;place-items:center;width:98px;height:98px;border-radius:50%;background:#fff;font-family:var(--fh);font-size:1.9rem}
.pbar{height:9px;border-radius:99px;background:#DCEFEA;overflow:hidden;margin:6px 0 4px}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--acc));animation:fill 1.2s var(--ease) .4s forwards}
@keyframes fill{to{width:var(--w)}}
.mr{margin-bottom:16px}.mr:last-child{margin-bottom:0}.mr div{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700}.mr small{color:var(--mut)}
.tip{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--p2),var(--ink));text-align:center}
.tip i.big{font-size:1.6rem;color:var(--acc);margin-bottom:8px}
.tip p{min-height:68px;font-size:.92rem;line-height:1.6;transition:opacity .4s}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}.dots i.on{background:var(--acc);width:20px;border-radius:99px}

/* prescriptions + products */
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:16px}
.pc{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);transition:.25s}
.pc:hover{transform:translateY(-5px);box-shadow:0 18px 30px -18px rgba(14,159,142,.65)}
.pc .bd{padding:14px}.pc h4{font-size:.95rem;margin-bottom:4px}
.pr{font-weight:800;color:var(--p);margin-bottom:10px}.pc .row{display:flex;gap:8px}.pc .row .btn{flex:1}
.rx{padding:18px;border-radius:14px;background:#fff;border:1px solid var(--line);transition:.25s;text-align:center}
.rx:hover{transform:translateY(-5px);border-color:var(--p);box-shadow:0 18px 30px -18px rgba(14,159,142,.65)}
.rx .ic{width:50px;height:50px;margin:0 auto 10px;display:grid;place-items:center;border-radius:14px;color:#fff;font-size:1.2rem;background:linear-gradient(135deg,var(--p),var(--p2))}
.rx h4{font-size:.98rem}.rx p{font-size:.8rem;color:var(--mut);margin:2px 0 10px}.rx .tag{margin-bottom:12px}
.up{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:26px 16px;margin-bottom:16px;border:2px dashed var(--p);border-radius:14px;background:rgba(14,159,142,.05);cursor:pointer;transition:.25s}
.up:hover,.up.drag{background:rgba(14,159,142,.12);transform:scale(1.01)}.up i{font-size:2rem;color:var(--p)}.up small{color:var(--mut)}
.up input{display:none}

/* settings */
.sr{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.sr:last-child{border-bottom:0}
.sr b{display:block;font-size:.92rem}.sr small{color:var(--mut);font-size:.8rem}
.sw{position:relative;width:44px;height:24px;border-radius:99px;background:#CFE3DE;transition:.3s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.3s var(--ease)}
.sw.on{background:var(--p)}.sw.on::after{transform:translateX(20px)}
.prof{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;text-align:center}.prof .av{width:72px;height:72px;font-size:2rem;background:var(--p);color:#fff}
.empty{text-align:center;color:var(--mut);padding:24px}.empty a{color:var(--p);font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;z-index:100;max-width:calc(100vw - 32px);text-align:center;transform:translate(-50%,20px);padding:12px 20px;border-radius:10px;background:var(--ink);color:#fff;font-size:.86rem;opacity:0;pointer-events:none;transition:.3s var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}

/* responsive */
@media(max-width:1100px){.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1024px){
  .side{transform:translateX(-100%);transition:transform .35s var(--ease);width:min(300px,84vw);border-radius:0 24px 24px 0;box-shadow:24px 0 60px -20px rgba(0,0,0,.65);padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none}.main{margin-left:0}.x,.burger{display:grid}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav>*{padding:13px 14px;font-size:.95rem}
  .side.open .nav>*{animation:navIn .45s var(--ease) both}
  .side.open .nav>*:nth-child(2){animation-delay:.05s}.side.open .nav>*:nth-child(3){animation-delay:.1s}.side.open .nav>*:nth-child(4){animation-delay:.15s}.side.open .nav>*:nth-child(5){animation-delay:.2s}.side.open .nav>*:nth-child(6){animation-delay:.25s}
}
@keyframes navIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media(max-width:720px){.content{padding:18px 16px 44px}.top{padding:10px 14px}.shop span{display:none}.hero{padding:26px 20px;justify-content:center;text-align:center}.hero p{margin:0 auto}.ecg{margin:14px auto 0}.hero h2{font-size:1.9rem}.top h1{font-size:1.35rem}.ch{justify-content:center;text-align:center}}
@media(max-width:480px){.stats{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.trk div{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}.pbar i{width:var(--w)}.ecg path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="app">
  <div class="ov" id="ov"></div>
  <aside class="side" id="side">
    <button class="x" id="closeSide" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
    <a href="../index.html" class="brand"><img src="../assets/stackly_logo.webp" alt="Stackly"></a>
    <p class="grp">My account</p><nav class="nav" id="navMain"></nav>
    <p class="grp">Quick links</p>
    <nav class="nav">
      <a href="./products.html"><i class="fa-solid fa-bag-shopping"></i> Shop Medicines</a>
      <a href="../index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
    </nav>
    <div class="su"><span class="av" id="sAv">?</span><div><b id="sName">Customer</b><small id="sMail">&mdash;</small></div></div>
    <button class="lo" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </aside>
  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <h1 id="title">Dashboard</h1>
      <div class="tr"><a href="./products.html" class="shop"><i class="fa-solid fa-bag-shopping"></i><span>Shop medicines</span></a><span class="av" id="tAv">?</span></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

  ];
  var rem = [
    { t: 'Metformin 500mg', s: 'After breakfast', tm: '8:00 AM', done: true },
    { t: 'Amlodipine 5mg', s: 'With water', tm: '1:00 PM', done: false },
    { t: 'Vitamin D3', s: 'After lunch', tm: '2:00 PM', done: false },
    { t: 'Metformin 500mg', s: 'After dinner', tm: '8:30 PM', done: false }
  ];
  var refills = [{ m: 'Metformin 500mg', d: 9, p: 70 }, { m: 'Amlodipine 5mg', d: 4, p: 88 }, { m: 'Vitamin D3', d: 21, p: 35 }];
  var wish = [
    { t: 'Digital Glucometer Kit', p: 24.9 },
    { t: 'Daily Multivitamin (60)', p: 12.5 },
    { t: 'Herbal Immunity Tonic', p: 9.9 }
  ];
  var feed = [
    { i: 'fa-truck-fast', t: 'Your Vitamin D3 + Omega-3 Combo has shipped', w: '2h ago' },
    { i: 'fa-bell', t: 'Amlodipine 5mg refill is due in 4 days', w: '1d ago' },
    { i: 'fa-tag', t: 'Members offer: 20% off on all vitamins this week', w: '2d ago' },
    { i: 'fa-circle-check', t: 'Metformin 500mg x 60 was delivered', w: '3w ago' }
  ];
  var tips = ['Take your medicines at the same time every day to build a steady routine.', 'Store tablets in a cool, dry place away from sunlight and out of children\u2019s reach.', 'Drink a full glass of water with tablets unless your pharmacist advises otherwise.', 'Never stop an antibiotic early, even if you feel better. Finish the full course.'];
  var pages = { dashboard: { t: 'Dashboard', i: 'fa-gauge-high' }, orders: { t: 'My Orders', i: 'fa-box' }, rx: { t: 'Prescriptions', i: 'fa-file-prescription' }, rem: { t: 'Reminders', i: 'fa-bell' }, wishlist: { t: 'Wishlist', i: 'fa-heart' }, settings: { t: 'Settings', i: 'fa-gear' } };
  var prefs = { ship: true, deals: true, refill: true, news: false };

  /* ---- Helpers ---- */
  function tag(s, t) { return '<span class="tag s-' + s + '">' + (t || s.charAt(0).toUpperCase() + s.slice(1)) + '</span>'; }
  function stat(i, ic, v, l) { return '<div class="stat rise" style="--i:' + i + '"><i class="fa-solid ' + ic + '"></i><b data-c="' + v + '">0</b><small>' + l + '</small></div>'; }
  var head = '<thead><tr><th>Item</th><th>Date</th><th>Total</th><th>Status</th></tr></thead>';
  function rows(list) { return list.map(function (o) { return '<tr><td><b>' + esc(o.item) + '</b><div class="t2">' + o.id + '</div></td><td>' + o.date + '</td><td><b>' + usd(o.amt) + '</b></td><td>' + tag(o.st) + '</td></tr>'; }).join(''); }
  function tracker(o) {
    var s = ['Ordered', 'Packed', 'Shipped', 'Delivered'], ic = ['fa-receipt', 'fa-box', 'fa-truck-fast', 'fa-house'];
    return '<div class="trk" style="--w:' + ((o.step - 1) / 3 * 75) + '%">' + s.map(function (x, k) { return '<div class="' + (k + 1 < o.step ? 'd' : k + 1 === o.step ? (o.step === 4 ? 'd' : 'c') : '') + '"><i class="fa-solid ' + ic[k] + '"></i>' + x + '</div>'; }).join('') + '</div>';
  }
  function wcard(w, k) {
    return '<div class="pc rise" style="--i:' + k + '"><div class="bd"><h4>' + esc(w.t) + '</h4><p class="pr">' + usd(w.p) + '</p><div class="row"><button class="btn sm" data-cart="' + esc(w.t) + '"><i class="fa-solid fa-cart-plus"></i> Add</button><button class="btn gh sm" data-rm="' + k + '" aria-label="Remove"><i class="fa-solid fa-trash"></i></button></div></div></div>';
  }
  function remItem(r, k) { return '<div class="rm' + (r.done ? ' done' : '') + '" data-rem="' + k + '" role="button" tabindex="0"><span class="ck"><i class="fa-solid fa-check"></i></span><div><b>' + esc(r.t) + '</b><small>' + esc(r.s) + '</small></div><span class="tm">' + r.tm + '</span></div>'; }
  function adherence() { var d = rem.filter(function (r) { return r.done; }).length; return Math.round(d / rem.length * 100); }
  function tog(k, t, s) { return '<div class="sr"><div><b>' + t + '</b><small>' + s + '</small></div><button class="sw' + (prefs[k] ? ' on' : '') + '" data-t="' + k + '" role="switch" aria-checked="' + prefs[k] + '" aria-label="' + t + '"></button></div>'; }
  var ecg = '<svg class="ecg" viewBox="0 0 320 44" aria-hidden="true"><path d="M0 22 H90 L102 22 L112 4 L126 40 L138 12 L146 22 H320"/></svg>';

  var views = {
    dashboard: function () {
      var late = orders[0];
      return '<div class="hero rise"><div><div class="eb">' + greet + '</div><h2>Hello, ' + esc(name) + '</h2><p>Track your orders, never miss a dose and refill your prescriptions in just a few taps.</p>' + ecg + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn amb" data-nav="rx"><i class="fa-solid fa-upload"></i> Upload prescription</button><a class="btn gh" style="color:#fff;border-color:rgba(255,255,255,.45)" href="./products.html">Shop medicines</a></div></div>' +
        '<section class="stats">' + stat(1, 'fa-box', orders.length, 'Total orders') + stat(2, 'fa-file-prescription', rx.length, 'Active prescriptions') + stat(3, 'fa-rotate', 2, 'Refills due soon') + stat(4, 'fa-star', 340, 'Reward points') + '</section>' +
        '<section class="g2"><div class="card rise" style="--i:5"><div class="ch"><div><h3>Track latest order</h3><p>' + esc(late.item) + ' &middot; ' + late.id + '</p></div>' + tag(late.st) + '</div>' + tracker(late) + '<div class="tw" style="margin-top:18px"><table>' + head + '<tbody>' + rows(orders.slice(1, 4)) + '</tbody></table></div></div>' +
        '<div class="card rise" style="--i:6"><div class="ch"><div><h3>Today&rsquo;s reminders</h3><p>Tap to mark as taken</p></div></div>' + rem.map(remItem).join('') + '</div></section>' +
        '<section class="g2"><div class="card rise" style="--i:7"><div class="ch"><div><h3>Refill status</h3><p>Medicine supply remaining</p></div><button class="btn gh sm" data-nav="rx">Manage</button></div>' +
        refills.map(function (r) { return '<div class="mr"><div><span>' + esc(r.m) + '</span><small>' + r.d + ' days left</small></div><div class="pbar"><i style="--w:' + r.p + '%"></i></div></div>'; }).join('') + '</div>' +
        '<div class="card tip rise" style="--i:8"><i class="fa-solid fa-lightbulb big"></i><div class="eb" style="margin-bottom:8px">Health tip</div><p id="tipText">' + tips[0] + '</p><div class="dots" id="dots">' + tips.map(function (t, k) { return '<i class="' + (k ? '' : 'on') + '"></i>'; }).join('') + '</div></div></section>' +
        '<section class="g2"><div class="card rise" style="--i:9"><div class="ch"><div><h3>Saved for later</h3><p>Ready when you are</p></div><button class="btn gh sm" data-nav="wishlist">See all</button></div><div class="pg">' + wish.slice(0, 3).map(wcard).join('') + '</div></div>' +
        '<div class="card rise" style="--i:10"><div class="ch"><div><h3>Activity</h3><p>Latest updates</p></div></div><ul class="feed">' + feed.map(function (f) { return '<li><i class="fa-solid ' + f.i + '"></i><div><p>' + f.t + '</p><small>' + f.w + '</small></div></li>'; }).join('') + '</ul></div></section>';
    },
    orders: function () {
      return '<div class="card rise"><div class="ch"><div><h3>My orders</h3><p>Everything you have bought from Stackly</p></div><a class="btn sm" href="./products.html">Shop more</a></div><div class="tw"><table>' + head + '<tbody>' + rows(orders) + '</tbody></table></div></div>' +
        orders.filter(function (o) { return o.step < 4; }).map(function (o, k) { return '<div class="card rise" style="--i:' + (k + 1) + '"><div class="ch"><div><h3>' + o.id + '</h3><p>' + esc(o.item) + '</p></div>' + tag(o.st) + '</div>' + tracker(o) + '</div>'; }).join('');
    },
    rx: function () {
      return '<label class="up rise" id="upBox"><i class="fa-solid fa-cloud-arrow-up"></i><b>Upload a new prescription</b><small>Drag a file here or tap to choose &middot; JPG, PNG or PDF &middot; max 5 MB</small><input type="file" id="rxFile" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"></label>' +
        '<div class="pg">' + rx.map(function (r, k) {
          return '<div class="rx rise" style="--i:' + (k + 1) + '"><div class="ic"><i class="fa-solid ' + r.ic + '"></i></div><h4>' + esc(r.m) + '</h4><p>' + esc(r.dr) + '<br>Valid till ' + r.till + ' &middot; ' + r.left + ' refill' + (r.left === 1 ? '' : 's') + ' left</p>' + tag(r.st, r.st === 'review' ? 'Under review' : r.st === 'expiring' ? 'Expiring soon' : 'Active') + '<br><button class="btn sm" data-refill="' + esc(r.m) + '"><i class="fa-solid fa-rotate"></i> Request refill</button></div>';
        }).join('') + '</div>';
    },
    rem: function () {
      var a = adherence();
      return '<section class="g2"><div class="card rise"><div class="ch"><div><h3>Medicine schedule</h3><p>Today&rsquo;s doses</p></div></div>' + rem.map(remItem).join('') + '</div>' +
        '<div class="card rise" style="--i:1;text-align:center"><div class="ch" style="justify-content:center"><div><h3>Today&rsquo;s adherence</h3><p>Doses taken on time</p></div></div><div class="ring" style="--v:' + a + '"><span id="adh">' + a + '%</span></div><small style="color:var(--mut);font-weight:700">' + rem.filter(function (r) { return r.done; }).length + ' of ' + rem.length + ' doses taken</small></div></section>';
    },
    wishlist: function () {
      return '<div class="card rise"><div class="ch"><div><h3>My wishlist</h3><p>' + wish.length + ' saved item' + (wish.length === 1 ? '' : 's') + '</p></div></div>' +
        (wish.length ? '<div class="pg">' + wish.map(wcard).join('') + '</div>' : '<p class="empty">Your wishlist is empty. <a href="./products.html">Browse medicines</a></p>') + '</div>';
    },
    settings: function () {
      return '<div class="card rise"><div class="ch" style="justify-content:center"><div><h3>Profile</h3><p>Your account details</p></div></div><div class="prof"><span class="av">' + esc(ini) + '</span><h3 style="font-family:var(--fh);font-weight:400;text-transform:capitalize">' + esc(name) + '</h3><small style="color:var(--mut)">' + esc(email) + '</small></div></div>' +
        '<div class="card rise" style="--i:1"><div class="ch"><div><h3>Notifications</h3><p>Choose what you hear from us</p></div></div>' +
        tog('ship', 'Order updates', 'Shipping and delivery alerts') + tog('refill', 'Refill reminders', 'Know before your medicine runs out') + tog('deals', 'Offer alerts', 'Weekly savings on products you use') + tog('news', 'Health newsletter', 'Tips and wellness advice') + '</div>' +
        '<div class="card rise" style="--i:2;text-align:center"><div class="ch" style="justify-content:center"><div><h3>Session</h3><p>Signed in as ' + esc(email) + '</p></div></div><button class="btn red" id="setLo"><i class="fa-solid fa-right-from-bracket"></i> Logout</button></div>';
    }
  };

  /* ---- Rendering ---- */
  var cur = localStorage.getItem('stacklyNav'); if (!pages[cur]) cur = 'dashboard';
  var tipTimer;
  function nav() {
    $('navMain').innerHTML = Object.keys(pages).map(function (k) {
      var n = k === 'wishlist' ? '<span class="n">' + wish.length + '</span>' : k === 'rem' ? '<span class="n">' + rem.filter(function (r) { return !r.done; }).length + '</span>' : '';
      return '<button data-nav="' + k + '" class="' + (k === cur ? 'on' : '') + '"><i class="fa-solid ' + pages[k].i + '"></i>' + pages[k].t + n + '</button>';
    }).join('');
  }
  function count() {
    [].forEach.call(document.querySelectorAll('[data-c]'), function (el) {
      var end = +el.getAttribute('data-c'), t0 = null;
      (function step(t) { if (!t0) t0 = t; var p = Math.min((t - t0) / 900, 1); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(performance.now());
    });
  }
  function tips_() {
    clearInterval(tipTimer);
    var p = $('tipText'); if (!p) return;
    var k = 0, d = document.querySelectorAll('#dots i');
    tipTimer = setInterval(function () {
      k = (k + 1) % tips.length; p.style.opacity = 0;
      setTimeout(function () { p.textContent = tips[k]; p.style.opacity = 1; [].forEach.call(d, function (x, j) { x.classList.toggle('on', j === k); }); }, 350);
    }, 6000);
  }
  function render(still) {
    $('title').textContent = pages[cur].t;
    $('content').classList.toggle('still', !!still);
    $('content').innerHTML = views[cur](); nav();
    if (!still) { scrollTo(0, 0); count(); }
    tips_();
    var b = $('setLo'); if (b) b.addEventListener('click', logout);
    var f = $('rxFile'); if (f) f.addEventListener('change', function () { upload(f.files[0]); });
    var box = $('upBox');
    if (box) {
      ['dragover', 'dragenter'].forEach(function (ev) { box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.add('drag'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { box.addEventListener(ev, function (e) { e.preventDefault(); box.classList.remove('drag'); }); });
      box.addEventListener('drop', function (e) { upload(e.dataTransfer.files[0]); });
    }
  }
  function upload(file) {
    if (!file) return;
    if (!/\.(jpe?g|png|pdf)$/i.test(file.name) || !/^(image\/(jpeg|png)|application\/pdf)$/.test(file.type)) return toast('Please upload a JPG, PNG or PDF file.');
    if (file.size > 5 * 1024 * 1024) return toast('File is too large. Maximum size is 5 MB.');
    rx.unshift({ m: 'New prescription', dr: file.name.length > 26 ? file.name.slice(0, 23) + '...' : file.name, left: 0, till: 'Pending review', st: 'review', ic: 'fa-file-medical' });
    toast('Prescription uploaded. Our pharmacist will review it shortly.'); render();
  }
  function side(open) { $('side').classList.toggle('open', open); $('ov').classList.toggle('show', open); document.body.style.overflow = open ? 'hidden' : ''; }

  $('sName').textContent = name; $('sMail').textContent = email; $('sAv').textContent = ini; $('tAv').textContent = ini;
  $('burger').addEventListener('click', function () { side(true); });
  $('closeSide').addEventListener('click', function () { side(false); });
  $('ov').addEventListener('click', function () { side(false); });
  $('logoutBtn').addEventListener('click', logout);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') side(false);
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-rem]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('click', function (e) {
    var n = e.target.closest('[data-nav]');
    if (n) { cur = n.getAttribute('data-nav'); localStorage.setItem('stacklyNav', cur); side(false); render(); return; }
    var c = e.target.closest('[data-cart]'); if (c) { toast(c.getAttribute('data-cart') + ' added to cart!'); return; }
    var rf = e.target.closest('[data-refill]'); if (rf) { toast('Refill requested for ' + rf.getAttribute('data-refill')); return; }
    var r = e.target.closest('[data-rm]'); if (r) { wish.splice(+r.getAttribute('data-rm'), 1); toast('Removed from wishlist'); render(true); return; }
    var m = e.target.closest('[data-rem]');
    if (m) { var it = rem[+m.getAttribute('data-rem')]; it.done = !it.done; toast(it.done ? 'Great! Dose marked as taken.' : 'Dose unmarked.'); render(true); return; }
    var t = e.target.closest('[data-t]');
    if (t) { var k = t.getAttribute('data-t'); prefs[k] = !prefs[k]; t.classList.toggle('on', prefs[k]); t.setAttribute('aria-checked', prefs[k]); }
  });
  render();
})();
</script>
</body>
</html>

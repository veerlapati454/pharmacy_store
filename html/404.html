<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | Stackly Pharmacy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/categories.css"><style>
/* 404 PAGE */
body{padding-top:0!important}
.nf{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 0;background:radial-gradient(circle at 50% 30%,#fff 0%,#DDF6F0 70%,#C9EFE6 100%);text-align:center}
.nf-logo{display:inline-flex;align-items:center;justify-content:center;padding:12px 30px;margin-bottom:22px;border-radius:50px;background:linear-gradient(135deg,#0A2E2B,#0E9F8E);box-shadow:0 12px 28px rgba(10,46,43,.28);transition:transform .3s}
.nf-logo:hover{transform:translateY(-3px) scale(1.04)}
.nf-logo img{height:44px;width:auto;max-width:100%;display:block}
@media(max-width:768px){.nf-logo{padding:10px 24px;margin-bottom:16px}.nf-logo img{height:34px}}
.nf-ic{position:absolute;color:var(--primary);opacity:.22;font-size:2rem;pointer-events:none;will-change:transform}
.nf-ic:nth-child(3n){font-size:2.8rem;opacity:.15}.nf-ic:nth-child(4n){font-size:1.5rem;opacity:.3}
.nf-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.nf-badge{margin-bottom:6px}
.nf-num{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,22px);font-family:'DM Serif Display',serif;font-size:clamp(6.5rem,22vw,13rem);line-height:1;color:var(--secondary);perspective:900px}
.nf-d{display:inline-block;text-shadow:0 14px 30px rgba(10,46,43,.18)}
.nf-zero{position:relative;display:inline-flex;align-items:center;justify-content:center;width:.78em;height:.78em;border-radius:50%;background:linear-gradient(135deg,var(--primary),#0A2E2B);color:#fff;font-size:inherit;box-shadow:0 18px 40px rgba(14,159,142,.4);cursor:pointer}
.nf-zero i{font-size:.4em}
.nf-zero::before,.nf-zero::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--primary);opacity:0;animation:nfRing 2.4s ease-out infinite}
.nf-zero::after{animation-delay:1.2s}
@keyframes nfRing{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.5);opacity:0}}
.ecg{width:min(520px,86%);height:70px;margin:6px 0 10px}
.ecg path{fill:none;stroke:var(--primary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 4px 8px rgba(14,159,142,.4))}
.nf-title{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);color:var(--secondary);margin-bottom:12px}
.nf-sub{max-width:560px;color:var(--text-muted);margin-bottom:28px}
.nf-btns{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:34px}
.nf-btn{min-width:170px;justify-content:center;will-change:transform}
.nf-or{font-weight:800;color:var(--secondary);font-size:.9rem;margin-bottom:14px;letter-spacing:.5px}
.nf-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.nf-links a{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:50px;background:#fff;border:2px solid var(--border-color);font-weight:700;font-size:.88rem;color:var(--text-dark);transition:var(--transition)}
.nf-links a i{color:var(--primary);transition:var(--transition)}
.nf-links a:hover{background:var(--primary);border-color:var(--primary);color:#fff;transform:translateY(-4px);box-shadow:0 10px 20px rgba(14,159,142,.3)}
.nf-links a:hover i{color:#fff}
@media(max-width:768px){.nf{padding:44px 0}.nf-btn{min-width:150px}.nf-ic{font-size:1.4rem}.nf-ic:nth-child(3n){font-size:2rem}}
@media(prefers-reduced-motion:reduce){.nf-zero::before,.nf-zero::after{animation:none}}
</style>
<script>if("scrollRestoration" in history)history.scrollRestoration="manual";</script>
</head>
<body>
<main>
<section class="nf" id="nf">
<i class="fa-solid fa-pills nf-ic" style="left:8%;top:14%" data-d="0.25"></i><i class="fa-solid fa-capsules nf-ic" style="left:84%;top:10%" data-d="0.50"></i><i class="fa-solid fa-plus nf-ic" style="left:18%;top:70%" data-d="0.75"></i><i class="fa-solid fa-heart-pulse nf-ic" style="left:88%;top:62%" data-d="1.00"></i><i class="fa-solid fa-syringe nf-ic" style="left:6%;top:40%" data-d="0.25"></i><i class="fa-solid fa-stethoscope nf-ic" style="left:92%;top:36%" data-d="0.50"></i><i class="fa-solid fa-tablets nf-ic" style="left:30%;top:88%" data-d="0.75"></i><i class="fa-solid fa-kit-medical nf-ic" style="left:72%;top:86%" data-d="1.00"></i><i class="fa-solid fa-prescription-bottle-medical nf-ic" style="left:50%;top:6%" data-d="0.25"></i><i class="fa-solid fa-leaf nf-ic" style="left:62%;top:20%" data-d="0.50"></i>
<div class="container nf-inner">
<a href="../index.html" class="nf-logo" aria-label="Stackly Home"><img src="../assets/stackly_logo.webp" alt="Stackly"></a>
<span class="badge nf-badge">Oops! Wrong Prescription</span>
<div class="nf-num" aria-label="404"><span class="nf-d">4</span><span class="nf-zero" id="nfZero"><i class="fa-solid fa-plus"></i></span><span class="nf-d">4</span></div>
<svg class="ecg" viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true"><path id="ecgPath" d="M0 40 H190 L215 40 L235 8 L262 72 L285 24 L300 40 H600"/></svg>
<h1 class="nf-title">Page Not Found</h1>
<p class="nf-sub">The page you are looking for has been moved, renamed or never existed. Don&rsquo;t worry &mdash; your health is still in good hands. Let&rsquo;s get you back on track.</p>
<div class="nf-btns"><button type="button" class="btn btn-outline nf-btn" id="goBack"><i class="fa-solid fa-arrow-left"></i> Go Back</button><a href="../index.html" class="btn btn-primary nf-btn" id="goHome"><i class="fa-solid fa-house"></i> Go Home</a></div>
<p class="nf-or">Or visit a popular page</p>
<div class="nf-links"><a href="./products.html"><i class="fa-solid fa-pills"></i> Medicines</a><a href="./categories.html"><i class="fa-solid fa-table-cells-large"></i> Categories</a><a href="./services.html"><i class="fa-solid fa-user-doctor"></i> Services</a><a href="./deals.html"><i class="fa-solid fa-tag"></i> Offers</a><a href="./contact.html"><i class="fa-solid fa-phone"></i> Contact</a></div>
</div></section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
/* 404 PAGE EFFECTS */
(function () {
  const q = (s, c = document) => Array.from(c.querySelectorAll(s));
  const home = '../index.html';

  /* Go Back: one step back in history, or home if there is nowhere to go */
  document.getElementById('goBack').addEventListener('click', () => {
    if (window.history.length > 1) window.history.back(); else window.location.href = home;
  });

  if (typeof gsap === 'undefined' || matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const path = document.getElementById('ecgPath'), len = path.getTotalLength();
  gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
  gsap.set('.nf-ic', { opacity: 0, scale: 0 });

  function intro() {
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.from('.nf-logo', { y: -50, scale: .6, opacity: 0, duration: .7, ease: 'back.out(1.8)', clearProps: 'transform,opacity' })
      .from('.nf-badge', { y: -30, scale: .6, opacity: 0, duration: .6, ease: 'back.out(2)' })
      .from('.nf-d', { y: -380, rotation: () => gsap.utils.random(-60, 60), opacity: 0, duration: 1.2, stagger: .25, ease: 'bounce.out' }, '-=.2')
      .from('.nf-zero', { scale: 0, rotation: -540, opacity: 0, duration: 1.1, ease: 'back.out(1.7)' }, '-=1.6')
      .to('.nf-ic', { opacity: (i, el) => el.matches(':nth-child(3n)') ? .15 : .25, scale: 1, duration: .8, stagger: { each: .07, from: 'random' }, ease: 'back.out(2)' }, '-=.8')
      .to(path, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, '-=.6')
      .from('.nf-title', { y: 40, opacity: 0, duration: .7 }, '-=.5')
      .from('.nf-sub', { y: 30, opacity: 0, duration: .7 }, '-=.45')
      .from('.nf-btn', { y: 40, scale: .7, opacity: 0, rotationX: -60, transformPerspective: 600, duration: .7, stagger: .15, ease: 'back.out(1.8)', clearProps: 'all' }, '-=.4')
      .from('.nf-or', { opacity: 0, duration: .5 }, '-=.2')
      .from('.nf-links a', { y: 25, scale: .8, opacity: 0, duration: .5, stagger: .08, ease: 'back.out(1.7)', clearProps: 'all' }, '-=.3');
    return tl;
  }
  const start = () => intro().then(() => {
    /* heartbeat: ECG redraws forever */
    gsap.timeline({ repeat: -1, repeatDelay: .4 }).set(path, { strokeDashoffset: len }).to(path, { strokeDashoffset: 0, duration: 1.6, ease: 'none' });
    /* continuous gentle pulse on the zero */
    gsap.to('.nf-zero', { scale: 1.06, duration: .7, yoyo: true, repeat: -1, ease: 'sine.inOut' });
    /* float the medical icons */
    q('.nf-ic').forEach(el => gsap.to(el, { y: gsap.utils.random(-30, 30), x: gsap.utils.random(-20, 20), rotation: gsap.utils.random(-40, 40), duration: gsap.utils.random(3, 6), yoyo: true, repeat: -1, ease: 'sine.inOut' }));
  });
  if (document.body.classList.contains('is-loading')) {
    const mo = new MutationObserver(() => { if (!document.body.classList.contains('is-loading')) { mo.disconnect(); start(); } });
    mo.observe(document.body, { attributes: true, attributeFilter: ['class'] });
  } else start();

  /* click the zero for a spin */
  document.getElementById('nfZero').addEventListener('click', e => {
    gsap.fromTo(e.currentTarget, { rotation: 0 }, { rotation: 720, duration: 1.2, ease: 'elastic.out(1,.5)' });
    gsap.fromTo('.nf-d', { y: 0 }, { y: -30, duration: .25, yoyo: true, repeat: 1, stagger: .1, ease: 'power2.out' });
  });

  /* mouse parallax for icons + 3D tilt for the numbers */
  const nf = document.getElementById('nf');
  if (matchMedia('(hover:hover)').matches) {
    nf.addEventListener('mousemove', e => {
      const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      q('.nf-ic').forEach(el => gsap.to(el, { xPercent: -x * 140 * (+el.dataset.d + .3), yPercent: -y * 140 * (+el.dataset.d + .3), duration: 1, ease: 'power2.out', overwrite: 'auto' }));
      gsap.to('.nf-num', { rotationY: x * 16, rotationX: -y * 12, duration: .8, ease: 'power2.out' });
    });
    nf.addEventListener('mouseleave', () => gsap.to('.nf-num', { rotationX: 0, rotationY: 0, duration: 1, ease: 'elastic.out(1,.5)' }));
    /* magnetic buttons */
    q('.nf-btn').forEach(b => {
      b.addEventListener('mousemove', e => { const r = b.getBoundingClientRect(); gsap.to(b, { x: (e.clientX - r.left - r.width / 2) * .25, y: (e.clientY - r.top - r.height / 2) * .35, duration: .3 }); });
      b.addEventListener('mouseleave', () => gsap.to(b, { x: 0, y: 0, duration: .6, ease: 'elastic.out(1,.4)' }));
    });
  }
})();
</script>
</body></html>
